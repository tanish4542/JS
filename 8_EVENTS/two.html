<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chai aur code</h1>
    <button id="stop">Stop</button>
</body>
<script>
    setTimeout(function(){
        console.log("hitesh");//does only time after 2000 seconds
        
    },2000)
    const changetext=function()
    {
        document.querySelector('h1').innerHTML = "Chai aur code 2";
    }
    const chaneme=setTimeout(changetext, 2000);
    //clearTimeout(chaneme) //this will stop the timeout from executing
    document.getElementById('stop').addEventListener('click',function(){
        clearTimeout(chaneme);
        console.log("timeout stopped");
    })
</script>
</html>
